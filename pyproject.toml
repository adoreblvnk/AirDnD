[project]
name = "airdnd"
version = "0.1.0"
description = "Deterministic AirDnD swarm simulation and evidence pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "torch>=2.4",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "ortools>=9.11",
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx2>=0.1"]

[build-system]
requires = ["setuptools>=75", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
